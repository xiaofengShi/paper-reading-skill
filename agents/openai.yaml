interface:
  display_name: "Paper Reading"
  short_description: "Illustrated readings with worked examples and interaction"
  default_prompt: "Use $paper-reading in Brief Reading mode unless I request Deep Reading. Deliver standalone illustrated HTML and its Markdown audit source in my preferred language, with sources at the end. For tutorials, assume limited topic background unless I specify otherwise; work a concrete example before formal detail, then reread every chapter and the recommended route as that learner and repair missing prerequisites, terms, calculations and exercise instructions before delivery. Preserve decisive evidence, limits and requested Deep coverage."
