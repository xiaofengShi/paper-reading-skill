interface:
  display_name: "Paper Reading"
  short_description: "Illustrated readings with worked examples and interaction"
  default_prompt: "Use $paper-reading in Brief Reading mode unless I request Deep Reading. Deliver one self-contained HTML with its Markdown audit source in my preferred language. Start with a concrete question and visual intuition, then a worked example or useful interactive experiment before formal detail. Define unfamiliar terms where used, retain decisive evidence and limits, and make extended derivations optional without omitting requested Deep coverage."
