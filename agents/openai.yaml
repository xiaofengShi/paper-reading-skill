interface:
  display_name: "Paper Reading"
  short_description: "Illustrated readings with worked examples and interaction"
  default_prompt: "Use $paper-reading to explain this paper in my preferred language. Use Brief unless I request Deep; default to a researcher new to the paper and adapt explanations to my background. Deliver a standalone illustrated HTML and Markdown source, with sources at the end, after checking explanation gaps, redundancy and evidence limits."
