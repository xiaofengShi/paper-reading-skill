<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 443" role="img" aria-labelledby="forward-graph-title forward-graph-desc">
<title id="forward-graph-title">输入、参数、预测、目标，各走哪条线</title><desc id="forward-graph-desc">输入二与参数零点二相乘得到预测零点四；目标一在模型外用于比较，平方误差为零点三六。前向计算尚未优化参数。</desc>
<defs><pattern id="forward-graph-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="443" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 03</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">输入、参数、预测、目标，各走哪条线</text>
<text x="28" y="111" class="label" fill="#2459bb" text-anchor="start">前向计算：使用当前参数作答</text><circle cx="92" cy="212" r="45" fill="#e0eafa"/><text x="92" y="221" class="value" fill="#2459bb" text-anchor="middle">2</text><text x="92" y="282" class="label" fill="#19324b" text-anchor="middle">输入 x</text><circle cx="395" cy="212" r="45" fill="#e0eafa"/><text x="395" y="221" class="value" fill="#2459bb" text-anchor="middle">0.4</text><text x="395" y="282" class="label" fill="#19324b" text-anchor="middle">预测</text><circle cx="680" cy="212" r="45" fill="#e0efec"/><text x="680" y="221" class="value" fill="#137c76" text-anchor="middle">0.36</text><text x="680" y="282" class="label" fill="#19324b" text-anchor="middle">平方误差</text><path d="M143 212L225 212" fill="none" stroke="#2459bb" stroke-width="2.5"/><path d="M218 207L225 212L218 217" fill="none" stroke="#2459bb" stroke-width="2.5"/><circle cx="261" cy="212" r="30" fill="#2459bb"/><text x="261" y="220" class="value" fill="#fff" text-anchor="middle">×</text><path d="M293 212L343 212" fill="none" stroke="#2459bb" stroke-width="2.5"/><path d="M336 207L343 212L336 217" fill="none" stroke="#2459bb" stroke-width="2.5"/><path d="M447 212L630 212" fill="none" stroke="#2459bb" stroke-width="2.5"/><path d="M623 207L630 212L623 217" fill="none" stroke="#2459bb" stroke-width="2.5"/><text x="528" y="191" class="small" fill="#19324b" text-anchor="start">与目标比较</text><text x="527" y="326" class="mono" fill="#137c76" text-anchor="start">(0.4 − 1)² = 0.36</text><rect x="185" y="326" width="152" height="66" rx="12" fill="#fff" stroke="#2459bb"/><text x="261" y="351" class="small" fill="#52677d" text-anchor="middle">当前参数 w</text><text x="261" y="378" class="value" fill="#2459bb" text-anchor="middle">0.2</text><path d="M261 326L261 244" fill="none" stroke="#2459bb" stroke-width="2"/><text x="552" y="126" class="label" fill="#137c76" text-anchor="start">训练目标 y = 1</text><path d="M680 137L680 163" fill="none" stroke="#137c76" stroke-width="2"/><text x="395" y="371" class="mono" fill="#19324b" text-anchor="start">2 × 0.2 = 0.4</text><text x="395" y="403" class="small" fill="#52677d" text-anchor="start">算出预测和误差，还没有更新参数。</text>
</svg>
