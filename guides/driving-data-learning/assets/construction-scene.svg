<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="construction-scene-title construction-scene-desc">
<title id="construction-scene-title">现在看见什么，训练时拿什么对答案</title><desc id="construction-scene-desc">车头朝右，前方车道被施工锥桶阻挡。蓝色虚线表示之后向左绕行再返回的专家轨迹，只作训练监督；模型输入是历史图像、当前车速和导航。</desc>
<defs><pattern id="construction-scene-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
