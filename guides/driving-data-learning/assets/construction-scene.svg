<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">施工绕行：当前输入与未来监督</title><desc id="d">左侧是一辆车，右侧为锥桶封闭区。蓝色虚线是人类驾驶员向左绕开的未来轨迹，只在训练中作目标；模型推理时看不到这条未来答案。</desc><rect width="760" height="380" rx="16" fill="#f3f6fb"/><text x="28" y="38" font-family="sans-serif" font-size="22" fill="#203348">先分清：模型现在看见什么，训练时拿什么对答案</text><rect x="28" y="70" width="704" height="200" rx="10" fill="#dce3ed"/><path d="M28 170H732" stroke="white" stroke-width="4" stroke-dasharray="18 12"/><rect x="82" y="191" width="74" height="38" rx="10" fill="#2459bb"/><path d="M160 210C245 210 230 108 340 108H555C625 108 625 210 700 210" fill="none" stroke="#2459bb" stroke-width="5" stroke-dasharray="10 7"/><path d="M430 235l20-45 20 45z M495 235l20-45 20 45z M560 235l20-45 20 45z" fill="#a84b15"/><text x="427" y="258" font-family="sans-serif" font-size="18" fill="#203348">封闭施工区</text><text x="305" y="92" font-family="sans-serif" font-size="18" fill="#164696">专家未来轨迹：监督答案</text><text x="42" y="308" font-family="sans-serif" font-size="18" fill="#203348">输入：历史图像、当前车速、导航</text><text x="42" y="342" font-family="sans-serif" font-size="18" fill="#203348">目标：之后怎样绕行　｜　“施工”标签本身不是未来轨迹</text></svg>