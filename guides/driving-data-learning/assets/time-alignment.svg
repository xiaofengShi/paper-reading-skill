<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" role="img" aria-labelledby="time-alignment-title time-alignment-desc">
<title id="time-alignment-title">把历史输入和未来监督放回时间轴</title><desc id="time-alignment-desc">历史输入截止当前时刻，未来目标在之后；补齐位置仍需有效性标记。车速十五米每秒时，零点一秒对应约一点五米行进距离。</desc>
<defs><pattern id="time-alignment-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="468" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 02</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">把历史输入和未来监督放回时间轴</text>
<text x="28" y="110" class="label" fill="#19324b" text-anchor="start">同一决策时刻 t = 0，是对齐的基准</text><path d="M170 156L744 156" fill="none" stroke="#7c91a8" stroke-width="2"/><path d="M180 149L180 163" fill="none" stroke="#7c91a8" stroke-width="2"/><text x="180" y="184" class="small" fill="#52677d" text-anchor="middle">−1.0 s</text><path d="M292 149L292 163" fill="none" stroke="#7c91a8" stroke-width="2"/><text x="292" y="184" class="small" fill="#52677d" text-anchor="middle">−0.5 s</text><path d="M404 149L404 163" fill="none" stroke="#7c91a8" stroke-width="2"/><text x="404" y="184" class="small" fill="#52677d" text-anchor="middle">0</text><path d="M516 149L516 163" fill="none" stroke="#7c91a8" stroke-width="2"/><text x="516" y="184" class="small" fill="#52677d" text-anchor="middle">+0.5 s</text><path d="M628 149L628 163" fill="none" stroke="#7c91a8" stroke-width="2"/><text x="628" y="184" class="small" fill="#52677d" text-anchor="middle">+1.0 s</text><path d="M740 149L740 163" fill="none" stroke="#7c91a8" stroke-width="2"/><text x="740" y="184" class="small" fill="#52677d" text-anchor="middle">+1.5 s</text><path d="M404 126L404 340" fill="none" stroke="#2459bb" stroke-width="2" stroke-dasharray="5 5"/><text x="28" y="238" class="small" fill="#19324b" text-anchor="start">图像 / 自车状态</text><text x="28" y="303" class="small" fill="#19324b" text-anchor="start">未来轨迹目标</text><rect x="150" y="212" width="60" height="41" rx="6" fill="#dce8fb" stroke="#2459bb"/><path d="M160 242l12-14 9 9 9-12 12 17" fill="none" stroke="#2459bb" stroke-width="2"/><rect x="262" y="212" width="60" height="41" rx="6" fill="#dce8fb" stroke="#2459bb"/><path d="M272 242l12-14 9 9 9-12 12 17" fill="none" stroke="#2459bb" stroke-width="2"/><rect x="374" y="212" width="60" height="41" rx="6" fill="#dce8fb" stroke="#2459bb"/><path d="M384 242l12-14 9 9 9-12 12 17" fill="none" stroke="#2459bb" stroke-width="2"/><rect x="485" y="277" width="62" height="41" rx="6" fill="#dceeea" stroke="#137c76"/><text x="516" y="303" class="small" fill="#137c76" text-anchor="middle">有效</text><rect x="597" y="277" width="62" height="41" rx="6" fill="#dceeea" stroke="#137c76"/><text x="628" y="303" class="small" fill="#137c76" text-anchor="middle">有效</text><rect x="709" y="277" width="62" height="41" rx="6" fill="url(#time-alignment-hatch)" stroke="#a9b9cb"/><text x="740" y="303" class="small" fill="#52677d" text-anchor="middle">占位</text><text x="182" y="341" class="small" fill="#2459bb" text-anchor="start">当时可获得的输入</text><text x="488" y="341" class="small" fill="#137c76" text-anchor="start">事后可用的监督；占位不等于有效</text><rect x="28" y="370" width="744" height="76" rx="12" fill="#fff" stroke="#d3dfec"/><text x="48" y="399" class="label" fill="#19324b" text-anchor="start">shape 对了，时间仍可能错。</text><text x="48" y="428" class="small" fill="#52677d" text-anchor="start">教学估算：15 m/s × 0.1 s 的时间偏差 = 1.5 m 的行进距离</text>
</svg>
