<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" role="img" aria-labelledby="evaluation-loops-title evaluation-loops-desc">
<title id="evaluation-loops-title">误差被记下来，还是会影响下一步</title><desc id="evaluation-loops-desc">开环模型输出不改变后续日志输入；闭环执行动作推进状态，再从新状态获取观测并规划，误差可能积累。</desc>
<defs><pattern id="evaluation-loops-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="555" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 07</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">误差被记下来，还是会影响下一步</text>
<text x="28" y="111" class="label" fill="#2459bb" text-anchor="start">开环：下一帧仍由固定日志给出</text><rect x="40" y="143" width="153" height="62" rx="12" fill="#fff" stroke="#afc4df"/><text x="116" y="180" class="label" fill="#2459bb" text-anchor="middle">日志 t</text><rect x="326" y="143" width="153" height="62" rx="12" fill="#fff" stroke="#afc4df"/><text x="402" y="180" class="label" fill="#2459bb" text-anchor="middle">模型预测</text><rect x="607" y="143" width="153" height="62" rx="12" fill="#fff" stroke="#afc4df"/><text x="683" y="180" class="label" fill="#2459bb" text-anchor="middle">日志 t+1</text><path d="M195 174L318 174" fill="none" stroke="#2459bb" stroke-width="2.5"/><path d="M311 169L318 174L311 179" fill="none" stroke="#2459bb" stroke-width="2.5"/><text x="244" y="156" class="small" fill="#52677d" text-anchor="middle">作为输入</text><path d="M116 143V124H683V143" fill="none" stroke="#93a6bc" stroke-width="2" stroke-dasharray="5 4"/><text x="469" y="233" class="small" fill="#52677d" text-anchor="middle">预测不改写下一帧日志</text><path d="M28 263L772 263" fill="none" stroke="#d1deeb" stroke-width="1"/><text x="28" y="304" class="label" fill="#137c76" text-anchor="start">闭环：动作改变状态，状态再改变输入</text><circle cx="116" cy="363" r="58" fill="#e0efec"/><text x="116" y="370" class="small" fill="#137c76" text-anchor="middle">当前观测</text><circle cx="402" cy="363" r="58" fill="#e0efec"/><text x="402" y="370" class="small" fill="#137c76" text-anchor="middle">策略 / 规划</text><circle cx="683" cy="363" r="58" fill="#e0efec"/><text x="683" y="370" class="small" fill="#137c76" text-anchor="middle">执行并推进状态</text><path d="M176 363L266 363" fill="none" stroke="#137c76" stroke-width="2.5"/><path d="M259 358L266 363L259 368" fill="none" stroke="#137c76" stroke-width="2.5"/><path d="M462 363L547 363" fill="none" stroke="#137c76" stroke-width="2.5"/><path d="M540 358L547 363L540 368" fill="none" stroke="#137c76" stroke-width="2.5"/><path d="M683 422V458H116V422" fill="none" stroke="#137c76" stroke-width="3"/><path d="M110 432L116 422L122 432" fill="none" stroke="#137c76" stroke-width="2.5"/><text x="400" y="487" class="label" fill="#137c76" text-anchor="middle">下一次看到什么，取决于刚才怎样行动。</text><text x="28" y="529" class="small" fill="#52677d" text-anchor="start">闭环还取决于控制器、动力学及其他车辆是否反应；仿真不等于实车验证。</text>
</svg>
