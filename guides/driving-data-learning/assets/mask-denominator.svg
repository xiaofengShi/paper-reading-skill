<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 473" role="img" aria-labelledby="mask-denominator-title mask-denominator-desc">
<title id="mask-denominator-title">mask 不只是遮住空格，它还决定分母</title><desc id="mask-denominator-desc">A的有效误差为一和四，B为九。有效点等权得到十四除三，样本等权得到五点七五；误除全部六个位置会稀释有效点目标。</desc>
<defs><pattern id="mask-denominator-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="473" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 04</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">mask 不只是遮住空格，它还决定分母</text>
<text x="28" y="111" class="label" fill="#19324b" text-anchor="start">每格已经是二维坐标误差平方和</text><text x="145" y="152" class="small" fill="#52677d" text-anchor="middle">第 1 点</text><text x="239" y="152" class="small" fill="#52677d" text-anchor="middle">第 2 点</text><text x="333" y="152" class="small" fill="#52677d" text-anchor="middle">第 3 点</text><text x="35" y="212" class="value" fill="#19324b" text-anchor="start">A</text><rect x="104" y="172" width="82" height="65" rx="8" fill="#dceeea" stroke="#137c76"/><text x="145" y="214" class="value" fill="#137c76" text-anchor="middle">1</text><rect x="198" y="172" width="82" height="65" rx="8" fill="#dceeea" stroke="#137c76"/><text x="239" y="214" class="value" fill="#137c76" text-anchor="middle">4</text><rect x="292" y="172" width="82" height="65" rx="8" fill="url(#mask-denominator-hatch)" stroke="#a9b9cb"/><text x="333" y="214" class="value" fill="#52677d" text-anchor="middle">×</text><text x="35" y="298" class="value" fill="#19324b" text-anchor="start">B</text><rect x="104" y="258" width="82" height="65" rx="8" fill="#dceeea" stroke="#137c76"/><text x="145" y="300" class="value" fill="#137c76" text-anchor="middle">9</text><rect x="198" y="258" width="82" height="65" rx="8" fill="url(#mask-denominator-hatch)" stroke="#a9b9cb"/><text x="239" y="300" class="value" fill="#52677d" text-anchor="middle">×</text><rect x="292" y="258" width="82" height="65" rx="8" fill="url(#mask-denominator-hatch)" stroke="#a9b9cb"/><text x="333" y="300" class="value" fill="#52677d" text-anchor="middle">×</text><text x="104" y="355" class="small" fill="#52677d" text-anchor="start">3 个有效点，3 个无效占位</text><path d="M411 138L411 360" fill="none" stroke="#d0ddeb" stroke-width="1"/><text x="442" y="166" class="small" fill="#137c76" text-anchor="start">有效点等权</text><text x="442" y="197" class="label" fill="#137c76" text-anchor="start">14 ÷ 3 = 4.667</text><text x="442" y="249" class="small" fill="#2459bb" text-anchor="start">样本等权</text><text x="442" y="280" class="label" fill="#2459bb" text-anchor="start">(2.5 + 9) ÷ 2 = 5.75</text><text x="442" y="332" class="small" fill="#b75524" text-anchor="start">误用固定 6 个位置</text><text x="442" y="363" class="label" fill="#b75524" text-anchor="start">14 ÷ 6 = 2.333</text><rect x="28" y="389" width="744" height="62" rx="12" fill="#fff" stroke="#d3dfec"/><text x="46" y="416" class="small" fill="#19324b" text-anchor="start">先选清楚目标：有效点等权与样本等权，是两种不同的定义。</text><text x="46" y="439" class="small" fill="#b75524" text-anchor="start">若目标是有效点等权，除以全部位置会让 padding 稀释 loss。</text>
</svg>
