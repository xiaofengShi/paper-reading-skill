<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" role="img" aria-labelledby="controlled-trial-title controlled-trial-desc">
<title id="controlled-trial-title">让“数据有没有用”变成可回答的实验</title><desc id="controlled-trial-desc">三组实验共享原始数据与实际更新预算。B比A增加数据，C比B只改变采样暴露；用相同独立评测协议比较，不能把多因素同时变化归因为新增数据。</desc>
<defs><pattern id="controlled-trial-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="555" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 08</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">让“数据有没有用”变成可回答的实验</text>
<text x="28" y="111" class="label" fill="#19324b" text-anchor="start">只改变要研究的因素，其余条件尽量一致</text><text x="36" y="157" class="small" fill="#52677d" text-anchor="start">实验</text><text x="181" y="157" class="small" fill="#52677d" text-anchor="start">原始数据</text><text x="339" y="157" class="small" fill="#52677d" text-anchor="start">新增数据</text><text x="500" y="157" class="small" fill="#52677d" text-anchor="start">采样策略</text><text x="665" y="157" class="small" fill="#52677d" text-anchor="start">实际更新预算</text><rect x="28" y="163" width="744" height="66" rx="8" fill="#fff" stroke="#d3dfec"/><text x="44" y="201" class="label" fill="#19324b" text-anchor="start">A 基线</text><circle cx="194" cy="185" r="5" fill="#2459bb"/><circle cx="221" cy="185" r="5" fill="#2459bb"/><circle cx="248" cy="185" r="5" fill="#2459bb"/><circle cx="194" cy="203" r="5" fill="#2459bb"/><circle cx="221" cy="203" r="5" fill="#2459bb"/><circle cx="248" cy="203" r="5" fill="#2459bb"/><text x="383" y="200" class="label" fill="#52677d" text-anchor="middle">—</text><text x="533" y="200" class="small" fill="#2459bb" text-anchor="middle">原策略</text><rect x="664" y="182" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="680" y="182" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="696" y="182" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="712" y="182" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="728" y="182" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><text x="703" y="220" class="small" fill="#52677d" text-anchor="middle">同预算</text><rect x="28" y="241" width="744" height="66" rx="8" fill="#fff" stroke="#d3dfec"/><text x="44" y="279" class="label" fill="#19324b" text-anchor="start">B 加数据</text><circle cx="194" cy="263" r="5" fill="#2459bb"/><circle cx="221" cy="263" r="5" fill="#2459bb"/><circle cx="248" cy="263" r="5" fill="#2459bb"/><circle cx="194" cy="281" r="5" fill="#2459bb"/><circle cx="221" cy="281" r="5" fill="#2459bb"/><circle cx="248" cy="281" r="5" fill="#2459bb"/><circle cx="366" cy="271" r="6" fill="#137c76"/><circle cx="388" cy="271" r="6" fill="#137c76"/><circle cx="410" cy="271" r="6" fill="#137c76"/><text x="533" y="278" class="small" fill="#2459bb" text-anchor="middle">原策略</text><rect x="664" y="260" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="680" y="260" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="696" y="260" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="712" y="260" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="728" y="260" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><text x="703" y="298" class="small" fill="#52677d" text-anchor="middle">同预算</text><rect x="28" y="319" width="744" height="66" rx="8" fill="#fff" stroke="#d3dfec"/><text x="44" y="357" class="label" fill="#19324b" text-anchor="start">C 调采样</text><circle cx="194" cy="341" r="5" fill="#2459bb"/><circle cx="221" cy="341" r="5" fill="#2459bb"/><circle cx="248" cy="341" r="5" fill="#2459bb"/><circle cx="194" cy="359" r="5" fill="#2459bb"/><circle cx="221" cy="359" r="5" fill="#2459bb"/><circle cx="248" cy="359" r="5" fill="#2459bb"/><circle cx="366" cy="349" r="6" fill="#137c76"/><circle cx="388" cy="349" r="6" fill="#137c76"/><circle cx="410" cy="349" r="6" fill="#137c76"/><text x="533" y="356" class="small" fill="#137c76" text-anchor="middle">改变暴露</text><rect x="664" y="338" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="680" y="338" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="696" y="338" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="712" y="338" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><rect x="728" y="338" width="11" height="24" rx="2" fill="#e2eaf6" stroke="#2459bb"/><text x="703" y="376" class="small" fill="#52677d" text-anchor="middle">同预算</text><text x="28" y="454" class="label" fill="#2459bb" text-anchor="start">B 对 A：固定预算下，加入数据的综合效果。</text><text x="28" y="487" class="label" fill="#137c76" text-anchor="start">C 对 B：同一份数据，改变暴露策略的效果与代价。</text><text x="28" y="529" class="small" fill="#52677d" text-anchor="start">统一模型、处理链与评测协议；在同一批独立场景上成对评测，并报告不确定性。</text>
</svg>
