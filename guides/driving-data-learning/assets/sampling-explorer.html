<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采样与损失权重实验台</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:16px/1.7 system-ui,-apple-system,sans-serif;margin:0;padding:24px;color:#203348;background:#f4f7fb}h1{font-size:23px;margin:0 0 12px}label{display:block;margin:18px 0 6px;font-weight:650}input{width:100%;min-height:44px;accent-color:#2459bb}button{min-height:44px;font:inherit;padding:8px 16px;background:white;border:1px solid #a1b4cc;border-radius:7px;cursor:pointer}button:hover{background:#e4edfc}button:focus-visible,input:focus-visible{outline:3px solid #2459bb;outline-offset:3px}dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}dl>div{background:white;padding:14px;border:1px solid #ced6e2;border-radius:8px}dt{font-size:14px}dd{font-size:25px;font-weight:700;margin:4px 0;color:#184b9d}p{margin:10px 0}.note{font-size:14px;color:#3f5064}@media(max-width:450px){body{padding:16px}dl{grid-template-columns:1fr}dd{font-size:23px}}@media print{input{display:none}}</style>
<h1>一批长尾数据到底能获得多少训练份额</h1><p>教学设定：100 万条数据，其中 1,000 条施工样本；固定抽取 32,000 次，每批 32 条，有放回独立采样。</p>
<label for="q">施工数据的抽样比例 q：<output id="q-label">0.1%</output></label><input id="q" type="range" min="0.1" max="50" step="0.1" value="0.1">
<label for="lambda">施工样本的额外损失权重 λ：<output id="lambda-label">1 倍</output></label><input id="lambda" type="range" min="1" max="20" step="1" value="1">
<svg viewBox="0 0 600 100" role="img" aria-labelledby="bar-title" style="width:100%;height:auto"><title id="bar-title">固定抽取预算中，施工样本占比的变化</title><rect x="10" y="10" width="580" height="35" rx="6" fill="#d7e1ef"/><rect id="tail-bar" x="10" y="10" width="0.58" height="35" fill="#2459bb"/><text id="bar-label" x="10" y="78" font-size="17" fill="#203348">施工 0.1% · 普通 99.9%</text></svg><button id="reset" type="button">重置到原始分布</button><dl aria-live="polite"><div><dt>预计抽到施工样本的次数（含重复）</dt><dd id="exposure">32</dd></div><div><dt>一个批次至少有一条施工样本的概率</dt><dd id="batch">3.15%</dd></div><div><dt>指定施工样本一次也没见过的概率</dt><dd id="unseen">96.85%</dd></div><div><dt>归一化目标中施工损失的系数份额</dt><dd id="mass">0.10%</dd></div></dl>
<p id="ratio">每条施工样本的采样权重是普通样本的 1.00 倍。</p><p class="note">系数份额 = qλ/(1−q+qλ)，不是实测梯度占比。不同样本的梯度大小、方向和优化器都会改变实际更新。数学假设变化时，本计算不适用。</p>
<noscript><style>input,button,select{display:none!important}</style><p>脚本关闭时控件不可用，可用正文的静态结果：q=0.1% 时预计 32 次；q=20% 时预计 6,400 次，所需每条样本权重比 249.75；再乘 λ=10 后，施工损失的系数份额升到 71.43%。</p></noscript>
<script>
const q=document.getElementById('q'),lambda=document.getElementById('lambda');
const put=(id,text)=>document.getElementById(id).textContent=text;
function update(){const p=+q.value/100,l=+lambda.value;document.getElementById('tail-bar').setAttribute('width',580*p);put('bar-label','施工 '+q.value+'% · 普通 '+(100-+q.value).toFixed(1)+'%');put('q-label',q.value+'%');put('lambda-label',l+' 倍');put('exposure',(32000*p).toLocaleString('zh-CN',{maximumFractionDigits:1}));put('batch',((1-Math.pow(1-p,32))*100).toFixed(2)+'%');put('unseen',(Math.pow(1-p/1000,32000)*100).toFixed(2)+'%');put('mass',(p*l/(1-p+p*l)*100).toFixed(2)+'%');put('ratio','每条施工样本的采样权重是普通样本的 '+(p*.999/(.001*(1-p))).toFixed(2)+' 倍。')};q.addEventListener('input',update);lambda.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{q.value=.1;lambda.value=1;update()});update();
</script></html>
