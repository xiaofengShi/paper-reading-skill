<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-labelledby="update-rhythm-title update-rhythm-desc">
<title id="update-rhythm-title">读了 4 批，不等于更新了 4 次</title><desc id="update-rhythm-desc">单卡每小批八次样本暴露，四小批累积梯度后仅执行一次参数更新；三十二次暴露不保证三十二条独立样本。存档按保存策略另行记录。</desc>
<defs><pattern id="update-rhythm-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="455" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 06</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">读了 4 批，不等于更新了 4 次</text>
<text x="28" y="111" class="label" fill="#2459bb" text-anchor="start">每个 microbatch：8 次样本暴露</text><text x="83" y="155" class="small" fill="#52677d" text-anchor="middle">读批 1</text><circle cx="48" cy="183" r="7" fill="#2459bb"/><circle cx="70" cy="183" r="7" fill="#2459bb"/><circle cx="92" cy="183" r="7" fill="#2459bb"/><circle cx="114" cy="183" r="7" fill="#2459bb"/><circle cx="48" cy="207" r="7" fill="#2459bb"/><circle cx="70" cy="207" r="7" fill="#2459bb"/><circle cx="92" cy="207" r="7" fill="#2459bb"/><circle cx="114" cy="207" r="7" fill="#2459bb"/><text x="82" y="242" class="small" fill="#52677d" text-anchor="middle">算梯度并累加</text><text x="234" y="155" class="small" fill="#52677d" text-anchor="middle">读批 2</text><circle cx="199" cy="183" r="7" fill="#2459bb"/><circle cx="221" cy="183" r="7" fill="#2459bb"/><circle cx="243" cy="183" r="7" fill="#2459bb"/><circle cx="265" cy="183" r="7" fill="#2459bb"/><circle cx="199" cy="207" r="7" fill="#2459bb"/><circle cx="221" cy="207" r="7" fill="#2459bb"/><circle cx="243" cy="207" r="7" fill="#2459bb"/><circle cx="265" cy="207" r="7" fill="#2459bb"/><text x="233" y="242" class="small" fill="#52677d" text-anchor="middle">算梯度并累加</text><text x="385" y="155" class="small" fill="#52677d" text-anchor="middle">读批 3</text><circle cx="350" cy="183" r="7" fill="#2459bb"/><circle cx="372" cy="183" r="7" fill="#2459bb"/><circle cx="394" cy="183" r="7" fill="#2459bb"/><circle cx="416" cy="183" r="7" fill="#2459bb"/><circle cx="350" cy="207" r="7" fill="#2459bb"/><circle cx="372" cy="207" r="7" fill="#2459bb"/><circle cx="394" cy="207" r="7" fill="#2459bb"/><circle cx="416" cy="207" r="7" fill="#2459bb"/><text x="384" y="242" class="small" fill="#52677d" text-anchor="middle">算梯度并累加</text><text x="536" y="155" class="small" fill="#52677d" text-anchor="middle">读批 4</text><circle cx="501" cy="183" r="7" fill="#2459bb"/><circle cx="523" cy="183" r="7" fill="#2459bb"/><circle cx="545" cy="183" r="7" fill="#2459bb"/><circle cx="567" cy="183" r="7" fill="#2459bb"/><circle cx="501" cy="207" r="7" fill="#2459bb"/><circle cx="523" cy="207" r="7" fill="#2459bb"/><circle cx="545" cy="207" r="7" fill="#2459bb"/><circle cx="567" cy="207" r="7" fill="#2459bb"/><text x="535" y="242" class="small" fill="#52677d" text-anchor="middle">算梯度并累加</text><path d="M80 264L530 264" fill="none" stroke="#137c76" stroke-width="3"/><path d="M80 254L80 264" fill="none" stroke="#137c76" stroke-width="3"/><path d="M530 254L530 264" fill="none" stroke="#137c76" stroke-width="3"/><text x="305" y="297" class="label" fill="#137c76" text-anchor="middle">累计 32 次样本暴露（可能重复）</text><path d="M578 196L631 196" fill="none" stroke="#137c76" stroke-width="2.5"/><path d="M624 191L631 196L624 201" fill="none" stroke="#137c76" stroke-width="2.5"/><circle cx="690" cy="196" r="43" fill="#137c76"/><text x="690" y="207" class="value" fill="#fff" text-anchor="middle">1</text><text x="690" y="264" class="small" fill="#137c76" text-anchor="middle">次实际更新</text><rect x="28" y="335" width="744" height="97" rx="12" fill="#fff" stroke="#d1deeb"/><text x="46" y="365" class="label" fill="#19324b" text-anchor="start">Checkpoint 是存档，不是另一种读批或更新。</text><text x="46" y="395" class="small" fill="#52677d" text-anchor="start">按保存策略记录参数、优化器等状态，以及数据与配置身份。</text><text x="46" y="419" class="small" fill="#52677d" text-anchor="start">示意假设：单卡、等大小累积且正确归一化；跳过更新应单独计数。</text>
</svg>
