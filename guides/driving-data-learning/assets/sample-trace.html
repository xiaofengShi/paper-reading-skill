<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一条样本在哪里退出训练</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font:16px/1.6 system-ui,-apple-system,sans-serif;color:#203348;background:#f4f7fb}h1{font-size:21px;margin:0 0 10px}p{margin:8px 0}label{font-weight:650}button,select{min-height:44px;font:inherit;border:1px solid #a1b4cc;border-radius:7px;background:white;color:#203348;padding:6px 12px;cursor:pointer}button:hover{background:#e4edfc}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #275eb5;outline-offset:3px}input[type=range]{width:100%;min-height:44px;accent-color:#2459bb}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}svg{display:block;width:100%;height:auto}.note{font-size:14px;color:#425269}output{font-variant-numeric:tabular-nums}.result{padding:12px;background:white;border:1px solid #cbd7e7;border-radius:8px}button[disabled]{opacity:.5;cursor:default}noscript{display:block;padding:10px;border:1px solid #a1b4cc} @media(max-width:450px){body{padding:12px}} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>选一条样本，沿着训练链向前走</h1><p class="note">合成日志教学例；五条数据都交付了，但去向不同。先看 new-003，再比较 new-005。</p><div class="controls"><label for="sample">样本</label><select id="sample"><option value="0">new-001</option><option value="1">new-002</option><option value="2" selected>new-003</option><option value="3">new-004</option><option value="4">new-005</option></select><button id="next" type="button">下一步</button><button id="reset" type="button">重置</button></div><svg viewBox="0 0 640 215" role="img" aria-labelledby="trace-title"><title id="trace-title">从已交付到训练监督的样本追踪</title><path d="M65 65H575" stroke="#b1bdce" stroke-width="4"/><g><circle id="node0" cx="65.0" cy="65" r="24" fill="#e2e8f1" stroke="#8193ad"/><text id="mark0" x="65.0" y="71" text-anchor="middle" font-size="18">1</text><text x="65.0" y="118" text-anchor="middle" font-size="19">已交付</text></g><g><circle id="node1" cx="192.5" cy="65" r="24" fill="#e2e8f1" stroke="#8193ad"/><text id="mark1" x="192.5" y="71" text-anchor="middle" font-size="18">2</text><text x="192.5" y="118" text-anchor="middle" font-size="19">进清单</text></g><g><circle id="node2" cx="320.0" cy="65" r="24" fill="#e2e8f1" stroke="#8193ad"/><text id="mark2" x="320.0" y="71" text-anchor="middle" font-size="18">3</text><text x="320.0" y="118" text-anchor="middle" font-size="19">过校验</text></g><g><circle id="node3" cx="447.5" cy="65" r="24" fill="#e2e8f1" stroke="#8193ad"/><text id="mark3" x="447.5" y="71" text-anchor="middle" font-size="18">4</text><text x="447.5" y="118" text-anchor="middle" font-size="19">被采样</text></g><g><circle id="node4" cx="575.0" cy="65" r="24" fill="#e2e8f1" stroke="#8193ad"/><text id="mark4" x="575.0" y="71" text-anchor="middle" font-size="18">5</text><text x="575.0" y="118" text-anchor="middle" font-size="19">有效监督</text></g><text id="trace-summary" x="320" y="172" text-anchor="middle" font-size="18">已交付。点击下一步，看它去了哪里。</text></svg><div class="result" role="status" id="diagnosis">尚未检查训练清单。</div><p class="note">✓ 表示本阶段通过，× 表示在此停止，— 表示未检查。最终有效监督也不等于收益；还要检查优化器更新与独立评测。</p><noscript><style>input,button,select{display:none!important}</style>脚本已关闭，操作控件不可用。静态结论：5 条交付 → 4 条进清单 → 3 条过校验 → 2 条被采样 → 1 条有有效监督。new-003 被抽到 3 次但有效目标为 0；new-005 抽到 4 次、累计有效目标暴露 24 点（含重复）。</noscript><script>const samples=[{"sample_id": "new-001", "in_manifest": false, "accepted": false, "draw_count": 0, "valid_target_steps": 0, "eligible_update_count": 0, "diagnosis": "未进入训练清单"}, {"sample_id": "new-002", "in_manifest": true, "accepted": false, "draw_count": 0, "valid_target_steps": 0, "eligible_update_count": 0, "diagnosis": "被质量过滤拒绝"}, {"sample_id": "new-003", "in_manifest": true, "accepted": true, "draw_count": 3, "valid_target_steps": 0, "eligible_update_count": 0, "diagnosis": "被采到但监督全部被 mask"}, {"sample_id": "new-004", "in_manifest": true, "accepted": true, "draw_count": 0, "valid_target_steps": 0, "eligible_update_count": 0, "diagnosis": "本次预算内未采到"}, {"sample_id": "new-005", "in_manifest": true, "accepted": true, "draw_count": 4, "valid_target_steps": 24, "eligible_update_count": 4, "diagnosis": "有有效监督且所属 batch 已更新；收益仍需消融与独立评测"}];let stage=0;const by=id=>document.getElementById(id);function state(){const s=samples[+by('sample').value];return [true,s.in_manifest,s.accepted,s.draw_count>0,s.valid_target_steps>0]};function update(){const s=samples[+by('sample').value],pass=state();let stop=pass.indexOf(false);if(stop<0)stop=5;const shown=Math.min(stage,stop);for(let i=0;i<5;i++){const active=i<=shown,ok=pass[i];by('node'+i).setAttribute('fill',!active?'#e2e8f1':ok?'#d8eade':'#f8e0cc');by('mark'+i).textContent=!active?'—':ok?'✓':'×'}const messages=['已交付。点击下一步，看它去了哪里。','训练清单里有这个 ID。','通过本次质量校验。','已被采样 '+s.draw_count+' 次（含重复）。','累计有效目标暴露 '+s.valid_target_steps+' 点（含重复）。'];by('trace-summary').textContent=stage>=stop&&stop<5?'在此停止：'+['','没进清单','质量拒绝','预算内未抽到','目标全部无效'][stop]:messages[shown];by('diagnosis').textContent=stage>=stop&&stop<5||stage===4?s.diagnosis:'还没走完，先不要推断模型已经学会。';by('next').disabled=stage>=Math.min(stop,4)}by('next').addEventListener('click',()=>{stage++;update()});by('reset').addEventListener('click',()=>{stage=0;update()});by('sample').addEventListener('change',()=>{stage=0;update()});update();</script></html>
