<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一次更新怎样改变预测</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font:16px/1.6 system-ui,-apple-system,sans-serif;color:#203348;background:#f4f7fb}h1{font-size:21px;margin:0 0 10px}p{margin:8px 0}label{font-weight:650}button,select{min-height:44px;font:inherit;border:1px solid #a1b4cc;border-radius:7px;background:white;color:#203348;padding:6px 12px;cursor:pointer}button:hover{background:#e4edfc}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #275eb5;outline-offset:3px}input[type=range]{width:100%;min-height:44px;accent-color:#2459bb}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}svg{display:block;width:100%;height:auto}.note{font-size:14px;color:#425269}output{font-variant-numeric:tabular-nums}.result{padding:12px;background:white;border:1px solid #cbd7e7;border-radius:8px}button[disabled]{opacity:.5;cursor:default}noscript{display:block;padding:10px;border:1px solid #a1b4cc} @media(max-width:450px){body{padding:12px}} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>把“一次学习”看成预测点的移动</h1><p>教学模型：输入固定为 2，目标固定为 1。当前权重 0.2，预测 0.4，平方误差 0.36。</p><label for="eta">学习率 η：<output id="eta-value">0.10</output></label><input type="range" id="eta" min="0" max="0.5" step="0.01" value="0.1"><svg viewBox="0 0 640 220" role="img" aria-labelledby="update-title"><title id="update-title">数轴上，旧预测、目标和更新后预测的位置</title><path d="M40 105H600" stroke="#72839b" stroke-width="2"/><path d="M40 90V120M226.67 90V120M413.33 90V120M600 90V120" stroke="#72839b"/><text x="40" y="148" text-anchor="middle">0</text><text x="226.67" y="148" text-anchor="middle">1</text><text x="413.33" y="148" text-anchor="middle">2</text><text x="600" y="148" text-anchor="middle">3</text><path d="M226.67 50V122" stroke="#365d40" stroke-width="2" stroke-dasharray="6 4"/><text x="226.67" y="36" text-anchor="middle" fill="#254f32">目标 1</text><circle cx="114.67" cy="105" r="9" fill="#73839c"/><text x="114.67" y="182" text-anchor="middle">旧预测 0.4</text><path id="move" d="M114.67 80H204.27" stroke="#2459bb" stroke-width="5"/><circle id="new-dot" cx="204.27" cy="80" r="10" fill="#2459bb"/><text id="new-label" x="204.27" y="60" text-anchor="middle" fill="#164696">新预测 0.88</text></svg><div class="result" role="status"><p>权重：<output id="weight">0.440</output>　新误差：<output id="loss">0.0144</output></p><p id="interpretation">这一步靠近目标，误差变小。</p></div><div class="controls"><button id="reset" type="button">重置到 0.10</button></div><p class="note">梯度固定为 −2.4；新权重 = 0.2 + 2.4η。图里只是一个标量的一步更新，没有模拟自动驾驶。</p><noscript><style>input,button,select{display:none!important}</style>脚本已关闭，滑块不可用。默认 η=0.10：新权重 0.44，新预测 0.88，新误差 0.0144。η=0.50：新预测 2.8，新误差 3.24，比原误差更大。</noscript><script>const el=id=>document.getElementById(id);function update(){const eta=+el('eta').value,w=.2+2.4*eta,p=2*w,loss=(p-1)**2;el('eta-value').textContent=eta.toFixed(2);el('weight').textContent=w.toFixed(3);el('loss').textContent=loss.toFixed(4);const px=40+p/3*560;el('new-dot').setAttribute('cx',px);el('move').setAttribute('d','M'+(40+.4/3*560)+' 80H'+px);el('new-label').setAttribute('x',Math.max(100,Math.min(540,px)));el('new-label').textContent='新预测 '+p.toFixed(2);el('interpretation').textContent=eta===0?'学习率为零：算出了梯度，参数仍没变化。':Math.abs(loss-.36)<1e-8?'这一步误差与原来相同。':loss<.36?'这一步靠近目标，误差变小。':'步子太大，跨过目标太远：误差反而增大。'}el('eta').addEventListener('input',update);el('reset').addEventListener('click',()=>{el('eta').value=.1;update()});update();</script></html>
