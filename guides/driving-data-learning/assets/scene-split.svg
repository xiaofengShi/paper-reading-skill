<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" role="img" aria-labelledby="scene-split-title scene-split-desc">
<title id="scene-split-title">窗口很多，不代表场景彼此独立</title><desc id="scene-split-desc">左侧同一事件的相邻窗口混入训练、验证和测试；右侧先按场景分组，使同一场景的窗口保持同一集合归属。</desc>
<defs><pattern id="scene-split-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b9c5d2" stroke-width="1"/></pattern></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-size:18px}.small{font-size:15px}.value{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}.kicker{font-size:13px;font-weight:700;letter-spacing:1.6px}.mono{font:17px ui-monospace,Menlo,monospace}</style>
<rect width="800" height="475" rx="16" fill="#f5f8fc"/>
<path d="M28 70H772" stroke="#d9e3ef"/>
<text x="28" y="31" class="kicker" fill="#2459bb" text-anchor="start">VISUAL NOTE / 01</text><text x="28" y="60" class="title" fill="#19324b" text-anchor="start">窗口很多，不代表场景彼此独立</text>
<text x="28" y="108" class="label" fill="#b75524" text-anchor="start">先切窗口，再随机分</text><text x="425" y="108" class="label" fill="#137c76" text-anchor="start">先分场景，再生成窗口</text><text x="28" y="167" class="small" fill="#19324b" text-anchor="start">场景 A</text><text x="425" y="167" class="small" fill="#19324b" text-anchor="start">场景 A</text><rect x="100" y="146" width="61" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="130" y="172" class="label" fill="#fff" text-anchor="middle">训</text><rect x="497" y="146" width="55" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="524" y="172" class="label" fill="#fff" text-anchor="middle">训</text><rect x="167" y="146" width="61" height="40" rx="5" fill="#b75524" stroke="#b75524"/><text x="197" y="172" class="label" fill="#fff" text-anchor="middle">测</text><rect x="558" y="146" width="55" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="585" y="172" class="label" fill="#fff" text-anchor="middle">训</text><rect x="234" y="146" width="61" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="264" y="172" class="label" fill="#fff" text-anchor="middle">训</text><rect x="619" y="146" width="55" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="646" y="172" class="label" fill="#fff" text-anchor="middle">训</text><rect x="301" y="146" width="61" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="331" y="172" class="label" fill="#fff" text-anchor="middle">验</text><rect x="680" y="146" width="55" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="707" y="172" class="label" fill="#fff" text-anchor="middle">训</text><path d="M106 194L354 194" fill="none" stroke="#8b9cb0" stroke-width="1"/><text x="228" y="211" class="small" fill="#52677d" text-anchor="middle">重叠窗口来自同一事件</text><text x="28" y="240" class="small" fill="#19324b" text-anchor="start">场景 B</text><text x="425" y="240" class="small" fill="#19324b" text-anchor="start">场景 B</text><rect x="100" y="219" width="61" height="40" rx="5" fill="#b75524" stroke="#b75524"/><text x="130" y="245" class="label" fill="#fff" text-anchor="middle">测</text><rect x="497" y="219" width="55" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="524" y="245" class="label" fill="#fff" text-anchor="middle">验</text><rect x="167" y="219" width="61" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="197" y="245" class="label" fill="#fff" text-anchor="middle">训</text><rect x="558" y="219" width="55" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="585" y="245" class="label" fill="#fff" text-anchor="middle">验</text><rect x="234" y="219" width="61" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="264" y="245" class="label" fill="#fff" text-anchor="middle">验</text><rect x="619" y="219" width="55" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="646" y="245" class="label" fill="#fff" text-anchor="middle">验</text><rect x="301" y="219" width="61" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="331" y="245" class="label" fill="#fff" text-anchor="middle">训</text><rect x="680" y="219" width="55" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="707" y="245" class="label" fill="#fff" text-anchor="middle">验</text><path d="M106 267L354 267" fill="none" stroke="#8b9cb0" stroke-width="1"/><text x="228" y="284" class="small" fill="#52677d" text-anchor="middle">重叠窗口来自同一事件</text><text x="28" y="313" class="small" fill="#19324b" text-anchor="start">场景 C</text><text x="425" y="313" class="small" fill="#19324b" text-anchor="start">场景 C</text><rect x="100" y="292" width="61" height="40" rx="5" fill="#2459bb" stroke="#2459bb"/><text x="130" y="318" class="label" fill="#fff" text-anchor="middle">训</text><rect x="497" y="292" width="55" height="40" rx="5" fill="#b75524" stroke="#b75524"/><text x="524" y="318" class="label" fill="#fff" text-anchor="middle">测</text><rect x="167" y="292" width="61" height="40" rx="5" fill="#137c76" stroke="#137c76"/><text x="1