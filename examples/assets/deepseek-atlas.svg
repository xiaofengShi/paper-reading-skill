<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4.1 Flash reading map</title>
  <desc id="desc">The paper connects a twenty-layer causal encoder and twenty-layer decoder to three cost levers: less prefill computation, smaller runtime global KV cache, and smaller persistent KV cache. The lower card gives reported model and benchmark figures with their meaning.</desc>
  <defs><style>
    text{font-family:Inter,Arial,sans-serif;fill:#203942}.small{font-size:15px;fill:#566b70}.caps{font-size:15px;font-weight:800;letter-spacing:2px;fill:#a05b38}.label{font-size:18px;font-weight:750}.large{font-size:28px;font-weight:800}.number{font-size:34px;font-weight:850;fill:#155f59}.topword{fill:#fff}.topmeta{fill:#d4e8df}.arrow{stroke:#6f9f91;stroke-width:3;fill:none;marker-end:url(#head)}
  </style><marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#6f9f91"/></marker></defs>
  <rect width="1200" height="710" fill="#fffefa"/><rect width="1200" height="76" fill="#173b40"/><text x="38" y="49" class="topword" font-size="24" font-weight="850" letter-spacing="2">PAPER READING</text><text x="846" y="47" class="topmeta" font-size="16">DEEPSEEK V4.1 FLASH / DEEP READ</text>
  <rect x="0" y="76" width="255" height="634" fill="#f3f8f5"/><line x1="255" y1="76" x2="255" y2="710" stroke="#d8e7e0" stroke-width="2"/>
  <text x="30" y="133" class="caps">SYSTEM QUESTION</text>
  <text x="30" y="180" class="label">How can an agent</text><text x="30" y="208" class="label">reuse long context</text><text x="30" y="236" class="label">at lower cost?</text>
  <path d="M65 258V302" class="arrow"/><text x="30" y="340" class="caps">THREE COSTS</text>
  <text x="30" y="386" class="label">Prefill compute</text><text x="30" y="424" class="label">Runtime global KV</text><text x="30" y="462" class="label">Persistent local KV</text>
  <path d="M65 485V530" class="arrow"/><text x="30" y="568" class="caps">DESIGN RESPONSE</text>
  <text x="30" y="611" class="label">CED · CSA2 · bounded</text><text x="30" y="639" class="label">replay / cache policy</text>
  <text x="295" y="132" class="caps">GLOBAL MAP</text><text x="295" y="174" class="large">Three different costs, three connected interventions</text>
  <rect x="295" y="211" width="180" height="89" rx="11" fill="#edf8f3" stroke="#b3d9c9"/><text x="317" y="249" class="label">Input + tools</text><text x="317" y="277" class="small">long reused prefix</text>
  <path d="M477 255H508" class="arrow"/><rect x="517" y="211" width="181" height="89" rx="11" fill="#e3f3ec" stroke="#a6d0bf"/><text x="540" y="249" class="label">Encoder ×20</text><text x="540" y="277" class="small">prefill backbone</text>
  <path d="M699 255H731" class="arrow"/><rect x="740" y="211" width="181" height="89" rx="11" fill="#e0f0e9" stroke="#9ccab7"/><text x="763" y="249" class="label">Decoder ×20</text><text x="763" y="277" class="small">global KV from encoder</text>
  <path d="M922 255H950" class="arrow"/><rect x="959" y="211" width="177" height="89" rx="11" fill="#fff2e9" stroke="#e8bb98"/><text x="980" y="249" class="label">Agent output</text><text x="980" y="277" class="small">autoregressive decode</text>
  <text x="295" y="335" class="small">CED changes which layers process a long prompt; CSA2 changes what global KV each layer stores.</text><text x="295" y="358" class="small">SWA Bounded Replay changes what local KV must remain in persistent storage.</text>
  <rect x="295" y="393" width="258" height="226" rx="15" fill="#f8fcfa" stroke="#c9ded5"/><text x="318" y="430" class="caps">PREFILL COMPUTE</text><text x="318" y="471" class="number">8B / 16B</text><text x="318" y="503" class="small">active parameters per token:</text><text x="318" y="528" class="small">prefill / decode</text><text x="318" y="578" class="small">CED and bounded decoder replay</text>
  <rect x="573" y="393" width="267" height="226" rx="15" fill="#f8fcfa" stroke="#c9ded5"/><text x="596" y="430" class="caps">RUNTIME GLOBAL KV</text><text x="596" y="471" class="number">890 B / token</text><text x="596" y="503" class="small">about 1/4 of V4 Flash</text><text x="596" y="528" class="small">at equal sequence length</text><text x="596" y="578" class="small">CSA2 reuse + FP4 cache</text>
  <rect x="860" y="393" width="276" height="226" rx="15" fill="#f8fcfa" stroke="#c9ded5"/><text x="883" y="430" class="caps">PERSISTENT KV</text><text x="883" y="471" class="number">~1/8</text><text x="883" y="503" class="small">of V4 Flash footprint</text><text x="883" y="528" class="small">at equal sequence length</text><text x="883" y="578" class="small">bounded replay + cache policy</text>
  <text x="295" y="670" class="small">Editorial map of the report · architecture and cache numbers from abstract, §§2–3 · not a paper figure</text>
</svg>
