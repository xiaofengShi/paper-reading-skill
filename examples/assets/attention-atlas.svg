<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Transformer reading map</title>
  <desc id="desc">A source sequence enters a six-layer encoder. Its output supplies keys and values to cross-attention in a six-layer decoder, while shifted target tokens pass through masked self-attention. The lower cards show the attention calculation and selected translation and ablation evidence.</desc>
  <defs><style>
    text{font-family:Inter,Arial,sans-serif;fill:#203942}.small{font-size:15px;fill:#596b70}.caps{font-size:15px;font-weight:800;letter-spacing:2px;fill:#a05b38}.label{font-size:18px;font-weight:750}.large{font-size:27px;font-weight:800}.value{font-size:25px;font-weight:850;fill:#155f59}.topword{fill:#fff}.topmeta{fill:#d4e8df}.arrow{stroke:#6f9f91;stroke-width:3;fill:none;marker-end:url(#head)}
  </style><marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#6f9f91"/></marker></defs>
  <rect width="1200" height="730" fill="#fffefa"/><rect width="1200" height="76" fill="#173b40"/><text x="38" y="49" class="topword" font-size="24" font-weight="850" letter-spacing="2">PAPER READING</text><text x="920" y="47" class="topmeta" font-size="16">TRANSFORMER / DEEP READ</text>
  <rect x="0" y="76" width="255" height="654" fill="#f3f8f5"/><line x1="255" y1="76" x2="255" y2="730" stroke="#d8e7e0" stroke-width="2"/>
  <text x="30" y="133" class="caps">PAPER QUESTION</text>
  <text x="30" y="180" class="label">Can transduction</text><text x="30" y="208" class="label">work without</text><text x="30" y="236" class="label">recurrence?</text>
  <path d="M65 258V302" class="arrow"/><text x="30" y="340" class="caps">DESIGN ANSWER</text>
  <text x="30" y="388" class="label">Attention mixes</text><text x="30" y="416" class="label">token context;</text><text x="30" y="444" class="label">position preserves</text><text x="30" y="472" class="label">order information.</text>
  <path d="M65 493V538" class="arrow"/><text x="30" y="578" class="caps">TESTED WITH</text>
  <text x="30" y="621" class="label">Translation BLEU</text><text x="30" y="649" class="label">and ablations</text><text x="30" y="677" class="small">See evidence at right</text>
  <text x="295" y="132" class="caps">GLOBAL MAP</text><text x="295" y="174" class="large">From parallel token mixing to translation evidence</text>
  <rect x="295" y="215" width="155" height="81" rx="11" fill="#edf8f3" stroke="#b3d9c9"/><text x="320" y="251" class="label">Source tokens</text><text x="320" y="276" class="small">+ position</text>
  <path d="M451 255H480" class="arrow"/><rect x="489" y="215" width="155" height="81" rx="11" fill="#e3f3ec" stroke="#a6d0bf"/><text x="511" y="250" class="label">Encoder ×6</text><text x="511" y="275" class="small">self-attn + FFN</text>
  <path d="M645 255H676" class="arrow"/><rect x="683" y="215" width="154" height="81" rx="11" fill="#e0f0e9" stroke="#9ccab7"/><text x="704" y="250" class="label">Decoder ×6</text><text x="704" y="275" class="small">masked + cross</text>
  <path d="M839 255H871" class="arrow"/><rect x="880" y="215" width="256" height="81" rx="11" fill="#fff2e9" stroke="#e8bb98"/><text x="902" y="250" class="label">Next-token distribution</text><text x="902" y="275" class="small">autoregressive output</text>
  <text x="683" y="326" class="small">Shifted target tokens enter masked self-attention;</text><text x="683" y="348" class="small">encoder memory supplies cross-attention K and V.</text>
  <rect x="295" y="389" width="406" height="248" rx="15" fill="#f8fcfa" stroke="#c9ded5"/><text x="323" y="428" class="caps">MECHANISM</text><text x="323" y="469" class="large">How attention mixes context</text><text x="323" y="516" font-size="25" font-family="Georgia,serif" font-style="italic">softmax(QKᵀ / √dₖ) V</text><text x="323" y="555" class="small">Eight heads learn different projections;</text><text x="323" y="579" class="small">the decoder mask blocks future positions.</text><text x="323" y="611" class="small">Full variables and a worked example appear below.</text>
  <rect x="723" y="389" width="413" height="248" rx="15" fill="#f8fcfa" stroke="#c9ded5"/><text x="751" y="428" class="caps">EVIDENCE</text><text x="751" y="469" class="large">What did the paper test?</text><text x="751" y="510" class="small">EN→DE test BLEU · big</text><text x="1109" y="510" text-anchor="end" class="value">28.4</text><text x="751" y="550" class="small">EN→FR test BLEU · big</text><text x="1109" y="550" text-anchor="end" class="value">41.8</text><text x="751" y="590" class="small">EN→DE dev · 8 vs 1 head</text><text x="1109" y="590" text-anchor="end" class="value">25.8 → 24.9</text>
  <text x="295" y="686" class="small">Editorial map of the paper’s argument · values from Tables 2–3 · arrows show data flow, not experiment order</text>
</svg>
