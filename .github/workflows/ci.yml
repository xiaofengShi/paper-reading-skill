name: Runtime and documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.3', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run doctor
      - run: npm run check:docs
      - run: npm run check:audit
      - run: npm run check:examples
      - name: Check the lightweight installation
        run: |
          node scripts/pack-skill.cjs --out "$RUNNER_TEMP/paper-reading-runtime"
          cd "$RUNNER_TEMP/paper-reading-runtime/paper-reading"
          npm ci
          npm run doctor
