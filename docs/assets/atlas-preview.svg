<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">MiMo-V2.6 visual reading atlas preview</title>
  <desc id="desc">A document view connecting a whole-paper training map, token-level learning mechanism, and experiment evidence.</desc>
  <defs>
    <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#dceee5"/><stop offset="1" stop-color="#bad8d0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#16484b" flood-opacity=".17"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#ground)"/>
  <g filter="url(#shadow)">
    <rect x="56" y="48" width="1088" height="704" rx="18" fill="#fffefa"/>
  </g>
  <rect x="56" y="48" width="1088" height="63" rx="18" fill="#14383e"/>
  <path d="M56 90h1088v21H56z" fill="#14383e"/>
  <text x="88" y="88" fill="#eaf7ef" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">PAPER READING</text>
  <text x="1068" y="88" fill="#b9e3d0" font-family="Arial, sans-serif" font-size="15" text-anchor="end">MIMO-V2.6  /  DEEP READ</text>
  <line x1="315" y1="111" x2="315" y2="752" stroke="#dce8e3" stroke-width="2"/>
  <text x="90" y="164" fill="#b26036" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PAPER QUESTION</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#2d4b4e">
    <text x="90" y="215" font-weight="700">How does mixed</text><text x="90" y="242" font-weight="700">agent RL scale?</text>
    <text x="90" y="316" fill="#a65934" font-size="13" font-weight="700" letter-spacing="2">MAIN OBSTACLES</text>
    <text x="90" y="359">Reward quality</text><text x="90" y="395">Task diversity</text><text x="90" y="431">Long rollouts</text>
    <text x="90" y="504" fill="#a65934" font-size="13" font-weight="700" letter-spacing="2">PAPER RESPONSE</text>
    <text x="90" y="547">GRS + GAR</text><text x="90" y="583">Mixed-task RL</text><text x="90" y="619">MOPD2</text>
  </g>
  <text x="348" y="159" fill="#a65934" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GLOBAL MAP</text>
  <text x="348" y="202" fill="#173940" font-family="Arial, sans-serif" font-size="29" font-weight="700">From base model to evaluated agent</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="348" y="234" width="137" height="68" rx="8" fill="#e6f1ec" stroke="#bad6c7"/>
    <text x="416" y="273" fill="#1d504d">Base model</text>
    <rect x="511" y="234" width="137" height="68" rx="8" fill="#e6f1ec" stroke="#bad6c7"/>
    <text x="579" y="273" fill="#1d504d">Agent SFT</text>
    <rect x="674" y="234" width="137" height="68" rx="8" fill="#d1e8dd" stroke="#94c4ac"/>
    <text x="742" y="273" fill="#174c48">Mixed RL</text>
    <rect x="837" y="234" width="137" height="68" rx="8" fill="#d1e8dd" stroke="#94c4ac"/>
    <text x="905" y="273" fill="#174c48">MOPD2</text>
    <rect x="1000" y="234" width="112" height="68" rx="8" fill="#fff1e6" stroke="#e9c19f"/>
    <text x="1056" y="273" fill="#98542e">Evaluate</text>
  </g>
  <g fill="none" stroke="#719f91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M487 268h19m-6-7 7 7-7 7M650 268h19m-6-7 7 7-7 7M813 268h19m-6-7 7 7-7 7M976 268h19m-6-7 7 7-7 7"/>
  </g>
  <rect x="348" y="339" width="374" height="332" rx="11" fill="#f4f8f5" stroke="#d7e5de"/>
  <text x="374" y="377" fill="#a65934" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">MECHANISM</text>
  <text x="374" y="414" fill="#173940" font-family="Arial, sans-serif" font-size="23" font-weight="700">How does RL learn?</text>
  <text x="374" y="451" fill="#53666a" font-family="Arial, sans-serif" font-size="16">Compare trajectories for one task</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="374" y="479" width="90" height="50" rx="7" fill="#d7ece0"/>
    <text x="419" y="511" fill="#195a4f">Rollout</text>
    <text x="489" y="511" fill="#7da39a">→</text>
    <rect x="513" y="479" width="90" height="50" rx="7" fill="#d7ece0"/>
    <text x="558" y="511" fill="#195a4f">Grade</text>
    <text x="626" y="511" fill="#7da39a">→</text>
    <rect x="650" y="479" width="49" height="50" rx="7" fill="#f7dfc9"/>
    <text x="675" y="511" fill="#96502c">A</text>
  </g>
  <text x="374" y="576" fill="#31565a" font-family="Georgia, serif" font-size="29" font-style="italic">r · M · A · log π</text>
  <text x="374" y="608" fill="#597076" font-family="Arial, sans-serif" font-size="15">The full objective and variables live in the reading page.</text>
  <rect x="748" y="339" width="364" height="332" rx="11" fill="#f4f8f5" stroke="#d7e5de"/>
  <text x="774" y="377" fill="#a65934" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EVIDENCE</text>
  <text x="774" y="414" fill="#173940" font-family="Arial, sans-serif" font-size="23" font-weight="700">What was tested?</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#476267">
    <text x="774" y="458">Scaling → does more RL help?</text>
    <text x="774" y="503">GAR → do online grades matter?</text>
    <text x="774" y="548">Harness → what breaks at scale?</text>
  </g>
  <text x="774" y="608" fill="#597076" font-family="Arial, sans-serif" font-size="15">Each question leads to setup, metric and result.</text>
  <text x="348" y="721" fill="#6e8282" font-family="Arial, sans-serif" font-size="14">An editorial preview of the published MiMo-V2.6 deep read · not a paper figure</text>
</svg>
